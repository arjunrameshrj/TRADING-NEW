<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant AI Strategy Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="background-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="container">
        <header>
            <div class="logo-area">
                <h1>Quant<span>AI</span></h1>
                <p class="subtitle">Expert Quantitative Trading Strategist</p>
            </div>
            <div class="status-indicator">
                <span class="dot pulse"></span>
                <span id="scanText">Engine Active</span>
            </div>
        </header>

        <div class="dashboard-controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Analyze any coin (e.g. BTCUSDT)">
                <button id="searchBtn" class="primary-btn search-btn">Deep Analysis</button>
            </div>
            
            <button id="refreshBtn" class="primary-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
                Scan Markets
            </button>
            <span id="lastUpdated" class="meta-text">Last scan: Never</span>
        </div>

        <div id="loader" class="loader-container hidden">
            <div class="spinner"></div>
            <p>Scanning...</p>
        </div>

        <!-- NEW: Deep Analysis Container -->
        <div id="analysisContainer" class="hidden"></div>

        <main id="signalsGrid" class="signals-grid">
            <!-- Signal Cards will be injected here via JS -->
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
